<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00897b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reisekosten">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<link rel="manifest" href="manifest.webmanifest">

<title>Reisekosten</title>

<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="MH3 Ingenieure – Reisekosten">
    <picture class="brand-logo">
      <source media="(max-width: 760px) and (prefers-color-scheme: dark)" srcset="icons/logo-mark-weiss.png">
      <source media="(max-width: 760px)" srcset="icons/logo-mark-schwarz.png">
      <source media="(prefers-color-scheme: dark)" srcset="icons/logo-quer-weiss.png">
      <img src="icons/logo-quer-schwarz.png" alt="MH3 Ingenieure">
    </picture>
    <span class="brand-sep"></span><span class="brand-title">Reisekosten</span>
  </a>
  <div class="topbar-right">
    <button id="sync-status" class="sync-status" data-action="sync" hidden></button>
    <button class="user-btn" data-action="nav" data-to="#/profil" aria-label="Profil"><span class="avatar" id="user-avatar"></span><span id="user-name" class="user-name"></span></button>
  </div>
</header>
<nav id="tabs" class="tabs" hidden></nav>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="pick-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="pick-file" accept="image/*,application/pdf,.pdf" multiple hidden><!-- ohne ausdrückliches HEIC liefert iOS Fotos als JPEG -->
<input type="file" id="pick-signature" accept="image/jpeg,image/png" hidden>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js" integrity="sha384-YnOjsoOxSYo65h1BXWnSq24bFbqW8HfzMWSEQxYEMRmjW9Vl1J3HZI3iZxqNYvIi" crossorigin="anonymous" defer></script>
<script src="config.js" defer></script>
<script src="version.js" defer></script>
<script src="media.js" defer></script>
<script src="calc.js" defer></script>
<script src="data.js" defer></script>
<script src="teams.js" defer></script>
<script src="review.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
